## Summary

This PR addresses **GUIL-35** by confirming that the application already prints the first 20 prime numbers, one per line, to stdout.

## Details

- Verified that `first_n_primes(count: int)` correctly returns the first `count` prime numbers.
- Verified that `main()` calls `first_n_primes(20)` and prints each prime on its own line.
- Existing tests already cover:
  - Correctness of the first 20 primes.
  - Behavior when requesting zero primes.
  - The exact output of `main()` to stdout.

No code changes were required because the current implementation already satisfies the Jira acceptance criteria.

